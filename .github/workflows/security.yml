name: Security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go packages
        run: govulncheck ./...

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Scan desktop dependencies
        # Tauri's Linux backend currently pins GTK/glib 0.18. The advisory
        # affects only glib::VariantStrIter, which Tintwire does not use, and
        # upgrading to glib 0.20 is blocked until Tauri moves off GTK3.
        run: cargo audit --file desktop/src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
