version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # 2.6.2 uses rust-ini ParseOption fields that no published rust-ini
      # (0.21.3 is the latest) provides, so the desktop build fails.
      # Remove once a fixed deep-link or rust-ini release is out.
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
      # single-instance 2.5.4 requires deep-link ^2.6.2 through the
      # "deep-link" feature this app enables, so it is held back too.
      - dependency-name: tauri-plugin-single-instance
        versions: ["2.5.4"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
